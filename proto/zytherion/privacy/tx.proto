syntax = "proto3";
package zytherion.privacy;

option go_package = "zytherion/x/privacy/types";

// Msg defines the Msg service for the privacy module (v0.3).
// ZK-SNARK (Groth16/BN254) removed. TFHE homomorphic encryption added.
service Msg {
  // EncryptedTransfer is DEPRECATED. Use TFHESubmit instead.
  rpc EncryptedTransfer(MsgEncryptedTransfer) returns (MsgEncryptedTransferResponse);

  // Deposit is DEPRECATED. Use InitCommitment instead.
  rpc Deposit(MsgDeposit) returns (MsgDepositResponse);

  // InitCommitment escrows plaintext coins and registers a 32-byte commitment.
  // v0.3: ZK proof fields removed — commitment is SHA-256 of user secret.
  rpc InitCommitment(MsgInitCommitment) returns (MsgInitCommitmentResponse);

  // TFHESubmit stores a TFHE FheUint32 ciphertext using erasure-coded shards.
  // Requires node to be started with --enable-tfhe.
  rpc TFHESubmit(MsgTFHESubmit) returns (MsgTFHESubmitResponse);
}

// MsgEncryptedTransfer is DEPRECATED. Kept for wire compatibility only.
message MsgEncryptedTransfer {
  string sender    = 1;
  string recipient = 2;
  bytes  amount_ciphertext = 3;
}

message MsgEncryptedTransferResponse {}

// MsgDeposit is DEPRECATED. Kept for wire compatibility only.
message MsgDeposit {
  string creator = 1;
  string amount  = 2;
}

message MsgDepositResponse {}

// MsgInitCommitment escrows plaintext coins and registers a 32-byte commitment.
// v0.3: ZK proof fields (zk_proof, public_inputs) removed.
// The commitment is now a plain SHA-256 hash of the user's private secret.
message MsgInitCommitment {
  string creator    = 1;
  string amount     = 2;
  bytes  commitment = 3;  // 32-byte SHA-256 hash of user secret
}

message MsgInitCommitmentResponse {}

// MsgTFHESubmit submits a TFHE FheUint32 ciphertext (~16-21 KB) for
// distributed erasure-coded storage across the network.
message MsgTFHESubmit {
  string sender     = 1;
  bytes  ciphertext = 2;  // Serialised FheUint32 (16–32 KB)
}

message MsgTFHESubmitResponse {
  bytes  commitment_hash = 1;  // SHA-256(ciphertext), 32 bytes
  uint32 total_shards    = 2;  // Always 16 (10 data + 6 parity)
}