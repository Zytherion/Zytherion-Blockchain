[package]
name = "homomorphic-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
backtraces = ["cosmwasm-std/backtraces"]

[dependencies]
cosmwasm-std = { version = "1.5", features = ["stargate"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
cw-storage-plus = "1.2"

[dev-dependencies]
cosmwasm-schema = "1.5"

[profile.release]
codegen-units = 1
opt-level = 3
debug = false
rpath = false
lto = true
strip = "debuginfo"

[workspace]
