version: 1
build:
  main: cmd/zytheriond
  flags:
    - "-tags"
    - "tfhe_cgo"
accounts:
  # 1. Public Sale / Ecosystem (45% = 450M ZYTC)
  - name: community_pool
    coins: ["4500000000000000zytc"]

  # 2. Staking Rewards (25% = 250M ZYTC)
  - name: rewards_reserve
    coins: ["2500000000000000zytc"]

  # 3. Development Fund (15% = 150M ZYTC)
  - name: zytherion_foundation
    coins: ["1500000000000000zytc"]

  # 4. Team & Founders (10% = 100M ZYTC)
  - name: team_vesting
    coins: ["500000000000000zytc"]
  - name: alice
    coins: ["500000000000000zytc"]

  # 5. Public Goods Funding (5% = 50M ZYTC)
  - name: public_goods
    coins: ["500000000000000zytc"]

  # Akun Testing (Bob)
  - name: bob
    coins: ["10000000000000zytc"]

genesis:
  app_state:
    staking:
      params:
        bond_denom: "zytc"
    mint:
      params:
        mint_denom: "zytc"
    crisis:
      constant_fee:
        denom: "zytc"
    gov:
      deposit_params:
        min_deposit:
          - denom: "zytc"
            amount: "100000000"

validators:
  - name: alice
    bonded: "100000000000000zytc" # Alice bonding 10M ZYTC

client:
  openapi:
    path: docs/static/openapi.yml

faucet:
  name: community_pool
  coins:
    - 100000000zytc # 10 ZYTC for every request

# ── Privacy & Cryptography Configuration (v0.4) ──────────────────────────────

privacy:
  # Validator signature algorithm (v0.3: upgraded from Dilithium3 to Dilithium5)
  # All validators must generate new Dilithium5 keys before joining.
  validator_signature_algo: "dilithium5"  # ML-DSA Level 5 (~256-bit PQ security)

  # TFHE Fully Homomorphic Encryption subsystem.
  # Default: false (disabled). Set to true to enable TFHE transactions.
  # Enabling TFHE activates:
  #   - Erasure-coded ciphertext storage (12+4=16 Reed-Solomon shards)
  #   - P2P shard distribution (ReplicationFactor=4 per shard)
  #   - tx/tfhe_submit RPC endpoint
  #   - query/tfhe_result RPC endpoint
  #   - Local shard storage at ~/.zytherion/tfhe_shards/
  enable_tfhe: false

  # TFHE shard distribution parameters (only relevant when enable_tfhe: true)
  tfhe:
    data_shards: 12          # minimum shards needed for reconstruction
    parity_shards: 4         # redundancy shards (up to 4 nodes can fail)
    replication_factor: 4    # each shard is stored on 4 different nodes
    max_ciphertext_kb: 512   # maximum accepted ciphertext size (KB)
    shard_port: 26780        # HTTP port for serving shards to peer requests
