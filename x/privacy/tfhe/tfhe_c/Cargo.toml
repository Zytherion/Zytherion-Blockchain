[package]
name = "tfhe_c"
version = "0.1.0"
edition = "2021"

[lib]
name = "tfhe_c"
crate-type = ["staticlib"]

[dependencies]
# tfhe-rs: the Fully Homomorphic Encryption library from Zama.
# We use the "integer" feature for FheUint32 operations (32-bit integers).
# shortint is a required base feature. x86_64-unix requires the correct backend.
tfhe = { version = "0.6", features = ["integer", "x86_64-unix"] }

# For serialisation of keys and ciphertexts over the FFI boundary.
bincode = "1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
# Even in dev, we need reasonable perf for FHE operations.
opt-level = 2
